<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141821">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Debrief">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Debrief</title>
<style>
:root{
  --bg:#f5f4f0; --surface:#ffffff; --surface-2:#f0efea; --surface-3:#e8e6e0;
  --ink:#17181b; --ink-2:#55585f; --ink-3:#8a8d94; --line:#e4e2dc; --line-2:#d6d3cc;
  --accent:#3554d1; --accent-ink:#ffffff; --accent-soft:#e9edfb;
  --hot:#ff8a3d;
  --ok:#1d7f48; --ok-soft:#e3f3e9; --warn:#a35f00; --warn-soft:#fbf0dc; --danger:#c2372c; --danger-soft:#fbe7e5;
  --shadow:0 1px 2px rgba(20,24,33,.05),0 6px 24px rgba(20,24,33,.06);
  --r:14px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1013; --surface:#17181c; --surface-2:#1e2024; --surface-3:#272a2f;
  --ink:#eceae5; --ink-2:#a6a8ad; --ink-3:#74777d; --line:#26282d; --line-2:#33363c;
  --accent:#8aa2ff; --accent-ink:#0c1230; --accent-soft:#1c2442;
  --ok:#5fcf8f; --ok-soft:#143322; --warn:#f0b35a; --warn-soft:#3a2a10; --danger:#ff7b6e; --danger-soft:#3b1714;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.i.sm{width:16px;height:16px}
.i.lg{width:24px;height:24px}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .tnum{font-variant-numeric:tabular-nums}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- layout */
.app{display:flex;min-height:100vh;min-height:100dvh}
.side{display:none}
main{flex:1;min-width:0;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.editing main{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
.page{padding:0 16px 24px;max-width:860px;margin:0 auto}
.top{position:sticky;top:0;z-index:15;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;margin:0 -16px 6px;display:flex;align-items:center;gap:8px;border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--line)}
.top h1{font-size:22px;letter-spacing:-.01em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{display:block;font-size:12px;font-weight:500;color:var(--ink-3);letter-spacing:0}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:flex-end;background:var(--surface);background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
body.editing .tabbar{display:none}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--ink-3);text-decoration:none;padding:5px 0 3px;border:0;background:none}
.tab.on{color:var(--ink)}
.tab-new{flex:1;display:flex;justify-content:center}
.tab-new button{width:52px;height:52px;border-radius:18px;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;margin-top:-18px;box-shadow:0 6px 18px rgba(20,24,33,.25)}
.tab-new .i{width:26px;height:26px;stroke-width:2.2}

@media (min-width:960px){
  .side{display:flex;flex-direction:column;gap:4px;width:252px;flex:none;position:sticky;top:0;height:100vh;height:100dvh;border-right:1px solid var(--line);padding:22px 14px 16px;background:var(--surface)}
  .tabbar{display:none}
  main,body.editing main{padding-bottom:0}
  .page{padding:0 36px 40px;max-width:1240px}
  .top{padding:22px 36px 14px;margin:0 -36px 10px}
  .top h1{font-size:26px}
}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.brand img{width:34px;height:34px;border-radius:9px}
.brand b{font-size:16px;letter-spacing:-.01em;display:block}
.brand span{font-size:12px;color:var(--ink-3)}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-weight:500}
.nav:hover{background:var(--surface-2)}
.nav.on{background:var(--surface-2);color:var(--ink)}
.nav .count{margin-left:auto;font-size:12px;color:var(--ink-3)}
.side .btn.pri{margin:0 4px 14px;justify-content:center}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);display:flex;flex-direction:column;gap:6px}
.side-foot .lock{display:flex;gap:6px;align-items:center}
.side-foot .userrow{display:flex;align-items:center;justify-content:space-between;gap:6px;color:var(--ink-2);font-size:13px}
.side-foot .userrow .ibtn{width:30px;height:30px;color:var(--ink-3)}
.side-foot .userrow .ibtn:hover{color:var(--danger);background:var(--danger-soft)}
.pill.planned{background:#e4f5e9;color:#1f7a43}
.pill.tentative{background:#fdecdc;color:#b4540a}
.pill.toaccept{background:#e3f0fd;color:#1d5fa8}
@media (prefers-color-scheme:dark){.pill.planned{background:#143322;color:#6fd69a}.pill.tentative{background:#3d2410;color:#f5a35c}.pill.toaccept{background:#14283f;color:#7fb6f0}}
.plan-chips{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 12px}
.plan-chips .chip small{color:var(--ink-3);font-weight:500}
.locline{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink-2);margin-top:10px}
.locline.cancel{color:var(--danger)}

/* ---------- controls */
.btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 15px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14.5px;white-space:nowrap;text-decoration:none;color:var(--ink);transition:transform .08s,background .15s}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{height:34px;padding:0 11px;border-radius:10px;font-size:13.5px}
.btn.block{width:100%;justify-content:center}
.btn[disabled]{opacity:.45;pointer-events:none}
.ibtn{width:38px;height:38px;border-radius:11px;border:0;background:transparent;display:inline-grid;place-items:center;color:var(--ink-2);flex:none}
.ibtn:hover{background:var(--surface-2)}
.ibtn.sm{width:32px;height:32px;border-radius:9px}
.ibtn.solid{background:var(--surface);border:1px solid var(--line)}
label.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin:0 0 6px}
.inp,select.inp,textarea.inp{width:100%;font-size:16px;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface);outline:none;min-height:44px;-webkit-appearance:none;appearance:none}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 17px) 19px,calc(100% - 12px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{resize:vertical;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.field{margin-bottom:12px}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:38px;border:0;border-radius:9px;background:transparent;font-weight:600;font-size:14px;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg.mini{display:inline-flex;padding:2px;border-radius:9px;gap:2px;vertical-align:middle}
.seg.mini button{height:26px;padding:0 9px;font-size:12.5px;border-radius:7px;flex:none}
.trnote{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:8px 10px;margin:0 0 8px}
.trnote .btn{margin-left:auto}
.fmtrow{margin:0 0 8px;overflow-x:auto;scrollbar-width:none}.fmtrow::-webkit-scrollbar{display:none}
.trnote.stale{background:#fdecdc;color:#8a3f06}
@media (prefers-color-scheme:dark){.trnote.stale{background:#3d2410;color:#f5c08f}}
.search{position:relative}
.search .i{position:absolute;left:12px;top:12px;color:var(--ink-3)}
.search .inp{padding-left:40px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;color:var(--ink)}
.chip.add{border-style:dashed;color:var(--ink-2);background:transparent}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .x{margin-right:-5px;width:22px;height:22px;border-radius:99px;display:grid;place-items:center;color:var(--ink-3)}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.filters::-webkit-scrollbar{display:none}
.filters .chip{flex:none}

/* ---------- badges and pills */
.badge{--h:220;width:40px;height:40px;border-radius:11px;flex:none;display:grid;place-items:center;font:700 12.5px/1 var(--mono);letter-spacing:.02em;background:hsl(var(--h) 55% 93%);color:hsl(var(--h) 50% 30%)}
.badge.sm{width:30px;height:30px;border-radius:8px;font-size:11px}
.badge.none{background:var(--surface-2);color:var(--ink-3)}
.badge.logo{position:relative;overflow:hidden;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.badge.logo .bc{visibility:hidden}
.badge.logo img{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);object-fit:contain}
.badge.logo.sm img{inset:2px;width:calc(100% - 4px);height:calc(100% - 4px)}
@media (prefers-color-scheme:dark){.badge{background:hsl(var(--h) 28% 20%);color:hsl(var(--h) 75% 80%)}}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:650;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:99px;background:currentColor;opacity:.8}
.pill.ready{background:var(--warn-soft);color:var(--warn)}
.pill.exported{background:var(--ok-soft);color:var(--ok)}
.pill.changed{background:var(--danger-soft);color:var(--danger)}

/* ---------- lists */
.group-h{font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin:18px 2px 8px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);text-decoration:none;color:inherit;background:none;width:100%;text-align:left;border-left:0;border-right:0;border-bottom:0}
.row:first-child{border-top:0}
.row:active{background:var(--surface-2)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none;font-size:12px;color:var(--ink-3)}
.row .metaline{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--ink-3);margin-top:4px}
.row .metaline span{display:inline-flex;align-items:center;gap:3px}
.row .metaline{min-width:0}
.row .metaline .loc{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.row .when{font-size:13.5px;color:var(--ink-2);margin-top:1px;font-variant-numeric:tabular-nums}
.tbl th.sortable{cursor:pointer;user-select:none}
.tbl th.sortable:hover{color:var(--ink)}
.tbl th .arr{display:inline-block;width:10px;margin-left:3px;opacity:.35;font-size:10px}
.tbl th.sorted{color:var(--ink)}
.tbl th.sorted .arr{opacity:1;color:var(--accent)}
.colmenu{position:relative}
.colpanel{position:absolute;right:0;top:calc(100% + 6px);z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px 12px 10px;min-width:220px}
.colpanel .check{padding:5px 0;font-size:14px}
.colpanel .foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-size:12px;color:var(--ink-3)}
.tbl .names{max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.tbl .loc{max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.empty{text-align:center;padding:48px 20px;color:var(--ink-2)}
.empty h2{font-size:18px;color:var(--ink);margin:14px 0 6px}
.empty p{margin:0 auto 18px;max-width:340px}
.empty .art{width:64px;height:64px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;margin:0 auto;color:var(--ink-2)}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--accent-soft);color:var(--ink);margin:4px 0 12px;font-size:14px}
.banner.warn{background:var(--warn-soft)}
.banner .i{color:var(--accent);margin-top:1px}
.banner.warn .i{color:var(--warn)}
.banner .grow{flex:1}
.banner b{display:block;margin-bottom:2px}
.banner .acts{display:flex;gap:8px;margin-top:8px}

/* table (backoffice) */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:nowrap;margin:4px 0 14px}
.toolbar .search{flex:1 1 220px;min-width:140px;max-width:360px}
.toolbar select.inp{width:auto;min-width:0;max-width:210px;flex:0 1 auto;text-overflow:ellipsis}
.toolbar2{display:flex;gap:10px;align-items:center;margin:-4px 0 14px;flex-wrap:wrap}
.toolbar2 input[type=date].inp{width:auto;min-width:150px}
.tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;overflow-x:auto}
@media (min-width:960px) and (max-width:1279px){
  .side{width:214px;padding:20px 12px 14px}
  .page{padding:0 24px 32px}
  .top{padding:20px 24px 12px;margin:0 -24px 8px}
  .toolbar{gap:8px}
  .toolbar select.inp{max-width:172px;padding-left:10px}
  .colmenu .btxt{display:none}
  .colmenu [data-colmenu]{width:44px;padding:0;justify-content:center}
  .tbl th,.tbl td{padding-left:9px;padding-right:9px}
  .tbl .subj{max-width:190px}
  .tbl .loc{max-width:160px}
  .tbl .cellair{max-width:180px}
}
.tbl .cellair{white-space:nowrap;overflow:hidden;max-width:165px}
.tbl .cellair .an{min-width:0;overflow:hidden;text-overflow:ellipsis}
@media (min-width:960px) and (max-width:1100px){
  .tbl th,.tbl td{padding-left:8px;padding-right:8px}
  .tbl .cellair .badge{display:none}
  .tbl .cellair{max-width:150px}
  .tbl .loc{max-width:125px}
  .tbl .subj{max-width:150px}
}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;font-weight:650;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;padding:11px 10px;border-bottom:1px solid var(--line);background:var(--surface);white-space:nowrap}
.tbl td{padding:10px 10px;border-top:1px solid var(--line);vertical-align:middle}
.tbl tr:first-child td{border-top:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl tr.sel td{background:var(--accent-soft)}
.tbl .cellair{display:flex;align-items:center;gap:10px;font-weight:600}
.tbl .subj{max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl .num{color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl input[type=checkbox],.ck{width:18px;height:18px;accent-color:var(--accent);margin:0;vertical-align:middle}
.bulk{position:sticky;bottom:16px;margin:14px auto 0;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);padding:8px 8px 8px 16px;border-radius:14px;box-shadow:var(--shadow);width:max-content;max-width:100%;flex-wrap:wrap}
.bulk .btn{background:transparent;border-color:rgba(255,255,255,.18);color:var(--bg)}
@media (prefers-color-scheme:dark){.bulk .btn{border-color:rgba(0,0,0,.2)}}

/* ---------- editor */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.sec>h3{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin:0 0 12px}
.sec>h3 .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500}
.airpick{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;min-height:60px}
.airpick .n{font-weight:650;font-size:16px}
.airpick .c{font-size:12.5px;color:var(--ink-3)}
.airpick .grow{flex:1;min-width:0}
.people{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.person{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.person .av{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--ink-3)}
.person .av img{width:100%;height:100%;object-fit:cover}
.person .grow{flex:1;min-width:0;cursor:pointer}
.person .t{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .s{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts-row{display:flex;gap:8px;flex-wrap:wrap}
.acts-row .btn{flex:1;justify-content:center;min-width:0}
.topic{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--surface);overflow:hidden}
.topic:focus-within{border-color:var(--line-2);box-shadow:0 0 0 3px var(--surface-2)}
.topic-h{display:flex;align-items:center;gap:4px;padding:6px 6px 0 12px}
.topic-h input{flex:1;min-width:0;border:0;background:transparent;font-weight:700;font-size:15px;padding:6px 0;outline:none}
.topic textarea{display:block;width:100%;border:0;background:transparent;padding:4px 12px 12px;font-size:16px;line-height:1.5;resize:none;outline:none;min-height:76px}
.topic textarea::placeholder{color:var(--ink-3)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--surface-2);border:0;padding:0}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:1.5px dashed var(--line-2);background:transparent;color:var(--ink-2);font-size:12.5px;font-weight:600}
.ph.on{outline:2.5px solid var(--accent);outline-offset:1px}
.phw{position:relative}
.phw .ph{width:100%}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;max-width:calc(100vw - 32px);animation:up .2s}
.toast button{background:none;border:0;color:var(--hot);font-weight:700;padding:0}
@media (min-width:960px){.toast{bottom:28px}}

/* login / sincronização */
body.gate .side,body.gate .tabbar{display:none}
body.gate main{padding-bottom:0}
.gatebox{max-width:400px;margin:0 auto;padding:calc(48px + env(safe-area-inset-top)) 20px 40px}
.gatebox img{width:64px;height:64px;border-radius:16px;display:block;margin-bottom:18px}
.gatebox h1{font-size:26px;margin:0 0 6px;letter-spacing:-.01em}
.gatebox p{color:var(--ink-2);margin:0 0 20px}
.gatebox .err{color:var(--danger);font-size:14px;min-height:20px;margin:6px 0 10px}
.syncst{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);white-space:nowrap}
.syncst::before{content:"";width:7px;height:7px;border-radius:9px;background:var(--ok)}
.syncst.busy::before{background:var(--warn)}
.syncst.off::before{background:var(--ink-3)}
.syncst.err::before{background:var(--danger)}
.syncst.local::before{display:none}
.syncst.dot{font-size:0;width:26px;height:38px;justify-content:center;cursor:pointer;flex:none}
.syncst.dot::before{width:10px;height:10px}
.top .ver{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.top .syncst{margin-top:2px}
/* settings / export */
.setrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.setpage{max-width:760px}
.setrow:last-child{border-bottom:0}
.setrow .av{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2);flex:none}
.setline{display:flex;align-items:center;gap:12px}
details.setgrp{padding:0}
details.setgrp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px}
details.setgrp>summary::-webkit-details-marker{display:none}
details.setgrp>summary .grow{flex:1;min-width:0}
.setline .grow{flex:1;min-width:0}
details.setgrp>summary .s{font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.setgrp>summary>svg:last-child{color:var(--ink-3);transition:transform .15s}
details.setgrp[open]>summary>svg:last-child{transform:rotate(90deg)}
details.setgrp .setbody{padding:0 14px 14px;border-top:1px solid var(--line);padding-top:12px}
.setfoot{text-align:center;font-size:13px;color:var(--ink-3);padding:6px 0 18px}
.setrow:last-child{border-bottom:0}
.setrow .grow{flex:1;min-width:0}
.setrow .inp{min-height:40px;padding:8px 10px}
.kpi{display:flex;gap:10px;margin-bottom:12px}
.kpi div{flex:1;background:var(--surface-2);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi span{font-size:12px;color:var(--ink-2)}
.how{font-size:14px;color:var(--ink-2)}
.how ol{padding-left:20px;margin:8px 0}
.how li{margin-bottom:6px}
.how code{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);padding:1px 5px;border-radius:5px;color:var(--ink)}
.check{display:flex;align-items:center;gap:10px;font-size:14.5px;padding:6px 0;cursor:pointer}
.two{display:grid;gap:12px}
@media (min-width:960px){.two{grid-template-columns:1fr 1fr;align-items:start}}

/* tabela em iPad horizontal / portáteis pequenos (no fim para prevalecer) */
@media (min-width:960px) and (max-width:1279px){
  .tbl .subj{max-width:130px}
  .tbl .loc{max-width:115px}
  .tbl .names{max-width:115px}

}

  .tbl .subj{max-width:115px}
  .tbl .loc{max-width:100px}
  .tbl .names{max-width:100px}
  .tbl .cellair{max-width:125px}
  .tbl th{letter-spacing:.02em}
}

  all() { return this.list().slice().sort((a, b) => (b.from || '').localeCompare(a.from || '') || (a.name || '').localeCompare(b.name || '')); },
  get(id) { return id ? this.list().find((e) => e.id === id) || null : null; },
  of(m) { return this.get(m && m.eventId); },
  count(e) { return S.meetings.filter((m) => !m._unsaved && m.eventId === e.id).length; },
  dates(e) {
    const p = (d) => { const [y, mo, da] = (d || '').split('-').map(Number); return y ? { y, mo, da } : null; };
    const a = p(e.from), b = p(e.to) || a; if (!a) return '';
    if (a.y === b.y && a.mo === b.mo) return `${a.da === b.da ? a.da : a.da + '–' + b.da} ${MESES[a.mo - 1]} ${a.y}`;
    return `${a.da} ${MESES[a.mo - 1]}${a.y !== b.y ? ' ' + a.y : ''} – ${b.da} ${MESES[b.mo - 1]} ${b.y}`;
  },
  sub(e) { return [this.dates(e), e.location].filter(Boolean).join(' · '); },
  covers(e, start) { const d = (start || '').slice(0, 10); return !!(e.from && d && d >= e.from && d <= (e.to || e.from)); },
  // reunião nova (ou vinda da agenda) dentro das datas de um único evento: fica logo associada
  autoFields(start) { const hit = this.list().filter((e) => this.covers(e, start)); if (hit.length !== 1) return {}; const e = hit[0]; return { eventId: e.id, ...(e.tradeshow ? { tradeshow: e.tradeshow } : {}) }; },
  assign(ms, e) {
    for (const m of ms) {
      if ((m.eventId || '') === (e ? e.id : '')) continue;
      const wasClean = m.status === 'exported' && !changedAfterExport(m);
      if (e) { m.eventId = e.id; if (e.tradeshow && !m.tradeshow && m.status !== 'exported') m.tradeshow = e.tradeshow; } else delete m.eventId;

/* ---------- fotos */
const urlCache = new Map();
function dropURL(id) { for (const k of [id + ':t', id + ':f']) { if (urlCache.has(k)) { URL.revokeObjectURL(urlCache.get(k)); urlCache.delete(k); } } }
async function photoURL(id, full) {
  const k = id + (full ? ':f' : ':t'); if (urlCache.has(k)) return urlCache.get(k);
  const p = await ensurePhoto(id, full); if (!p) return '';
  const buf = full ? (p.data || p.thumb) : (p.thumb || p.data); if (!buf) return '';
  const u = URL.createObjectURL(new Blob([buf], { type: p.mime || 'image/jpeg' }));
  urlCache.set(k, u); return u;
}
const photoFetches = new Map();
async function ensurePhoto(id, full = false) {
  let p = await DB.get('photos', id);
  if (!Sync.on()) return p || null;
  if (!p) p = { id, kind: 'note', mime: 'image/jpeg', data: null, thumb: null, updatedAt: 0 };
  if ((full ? p.data : p.thumb) || !navigator.onLine) return p;
  const key = id + (full ? ':f' : ':t');
  if (!photoFetches.has(key)) photoFetches.set(key, (async () => {
    try {
      const { data, error } = await Sync.client().storage.from(CLOUD.bucket).download(full ? `${id}.jpg` : `${id}_t.jpg`);
      if (error || !data) return;
      const cur = (await DB.get('photos', id)) || p; const buf = await data.arrayBuffer();
      if (full) cur.data = buf; else cur.thumb = buf;
      await DB.rawPut('photos', cur);
    } finally { photoFetches.delete(key); }
  })());
  await photoFetches.get(key);
  return (await DB.get('photos', id)) || p;
}
async function hydrateImgs(root) {
  for (const img of $$('img[data-pid]', root)) { if (!img.src) img.src = await photoURL(img.dataset.pid, img.dataset.full === '1'); }
}
function loadImage(file) {
  return new Promise((res, rej) => { const u = URL.createObjectURL(file); const img = new Image(); img.onload = () => { res(img); setTimeout(() => URL.revokeObjectURL(u), 1000); }; img.onerror = () => rej(new Error('Imagem inválida')); img.src = u; });
}
function canvasBlob(img, max, q) {
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.round(img.naturalWidth * s), h = Math.round(img.naturalHeight * s);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(img, 0, 0, w, h);
  return new Promise((res) => cv.toBlob((b) => res({ blob: b, w, h }), 'image/jpeg', q));
}
async function savePhoto(file, kind, owner) {
  const img = await loadImage(file);
  const full = await canvasBlob(img, kind === 'card' ? 1800 : 2200, 0.84);
  const thumb = await canvasBlob(img, 420, 0.72);
  const now = Date.now();
  const p = { id: uid(), kind, owner, mime: 'image/jpeg', data: await full.blob.arrayBuffer(), thumb: await thumb.blob.arrayBuffer(), w: full.w, h: full.h, createdAt: now, updatedAt: now };
  await DB.put('photos', p); askPersist();
  return p;
}
function pickImages({ capture = false, multiple = false } = {}) {
  return new Promise((resolve) => {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
    if (capture) inp.setAttribute('capture', 'environment');
    if (multiple) inp.multiple = true;
    inp.style.display = 'none'; document.body.appendChild(inp);
    inp.addEventListener('change', () => { resolve([...inp.files]); inp.remove(); });
    inp.addEventListener('cancel', () => { resolve([]); inp.remove(); });
    inp.click();
  });
}

/* ---------- leitura de cartões (OCR local, sem rede) */
const OCR = {
  worker: null, loading: null, onProgress: null,
  async get() {
    if (this.worker) return this.worker;
    if (!this.loading) {
      this.loading = (async () => {
        if (!window.Tesseract) await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'vendor/ocr/tesseract.min.js'; s.onload = res; s.onerror = () => rej(new Error('Não foi possível carregar o leitor')); document.head.appendChild(s); });
        const base = new URL('vendor/ocr/', location.href).href;
        return Tesseract.createWorker(['eng', 'por'], 1, {
          workerPath: base + 'worker.min.js', corePath: base + 'core', langPath: base + 'lang', gzip: true, cacheMethod: 'none', workerBlobURL: false,
          logger: (m) => { if (this.onProgress) this.onProgress(m); },
        });
      })();
    }
    try { this.worker = await this.loading; } catch (e) { this.loading = null; throw e; }
    return this.worker;
  },
  async read(blob, onProgress) {
    this.onProgress = onProgress;
    const w = await this.get();
    const { data } = await w.recognize(blob);
    this.onProgress = null;
    return data.text || '';
  },
};

/* ---------- leitura com IA (Claude, via função do Supabase; a chave nunca está na app) */
const AI = {
  fn: 'debrief-ler',
  off: 0, // pausa depois de falhas de configuração (sem chave / sem função)
  available() { return Sync.on() && navigator.onLine && S.settings.aiRead !== false && Date.now() > this.off; },
  async b64(buf) {
    const blob = new Blob([buf], { type: 'image/jpeg' });
    const url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });
    return String(url).split(',')[1] || '';
  },
  async read(mode, pid, extra = {}) {
    const p = await ensurePhoto(pid, true); if (!p || !p.data) throw new Error('Foto indisponível');
    const image = await this.b64(p.data);
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 75000);
    try {
      const { data, error } = await Sync.client().functions.invoke(this.fn, { body: { mode, image, ...extra }, signal: ctl.signal });
      if (error) {
        let info = {}; try { info = await error.context?.json?.(); } catch (e) {}
        const st = error.context?.status || 0;
        if (st === 404 || info?.error === 'sem_chave') this.off = Date.now() + 10 * 60 * 1000;
        throw new Error(info?.message || (st === 404 ? 'Leitura com IA ainda não configurada' : 'Leitura com IA indisponível'));
      }
      return data || {};
    } finally { clearTimeout(t); }
  },
};

}

function periodRange(f) {
  const t = new Date(); const d = (x) => ymd(x); const add = (n) => { const x = new Date(t); x.setDate(x.getDate() + n); return x; };
  switch (f.period || 'all') {
    case 'today': return [d(t), d(t)];
    case 'next7': return [d(t), d(add(7))];
    case 'week': { const dow = (t.getDay() + 6) % 7; return [d(add(-dow)), d(add(6 - dow))]; }
    case 'month': return [d(new Date(t.getFullYear(), t.getMonth(), 1)), d(new Date(t.getFullYear(), t.getMonth() + 1, 0))];
    case 'last30': return [d(add(-30)), d(t)];
    case 'custom': return [f.from || '', f.to || ''];
    default: return ['', ''];
  }
}
function filteredMeetings() {
  const f = S.list; const q = norm(f.q);
  return S.meetings.filter((m) => {
    if (!inState(m, f.status)) return false;
    if (f.airline && airlineKey({ code: m.airlineCode, name: m.airlineName }) !== f.airline) return false;
    if (f.event === '_none' ? !!EV.of(m) : f.event && m.eventId !== f.event) return false;
    const day = (m.start || '').slice(0, 10);
    const [pf, pt] = periodRange(f);
    if (pf && day < pf) return false;
    if (pt && day > pt) return false;
    if (q) {
      const hay = norm([m.airlineName, m.airlineCode, EV.of(m)?.name, subjectOf(m), m.raw, m.nextSteps, m.internal, ...m.topics.map((t) => t.name + ' ' + t.text), ...m.contactIds.map((id) => contactName(getC(id)))].join(' '));
      if (!q.split(/\s+/).every((w) => hay.includes(w))) return false;
    }
    return true;
  }).sort((x, y) => (['agenda', 'toaccept', 'tentative', 'planned'].includes(f.status) ? (x.start || '').localeCompare(y.start || '') : (y.start || '').localeCompare(x.start || '')) || y.createdAt - x.createdAt);
}
/* Estados: agenda (confirmada/por confirmar) → por registar (já passou, sem notas) → rascunho → concluída → exportada; mais alterada após exportar e cancelada na agenda */
function stateOf(m) {
  if (m.icsStatus === 'CANCELLED' && m.status !== 'exported') return 'cancelled';
  if (m.status === 'planned') { const t0 = parseLocal(m.start); const ended = !!t0 && Date.now() > t0.getTime() + (m.durationMin || 30) * 60000; if (!ended && m.icsStatus === 'NEEDS-ACTION') return 'toaccept'; if (m.icsStatus === 'TENTATIVE') return 'tentative'; return ended ? 'torecord' : 'planned'; }
  if (changedAfterExport(m)) return 'changed';
  return m.status || 'draft';
}
// Pendentes (o filtro por defeito): agendadas e rascunhos — o que ainda tem trabalho. Concluídas, exportadas e canceladas ficam escondidas.
const PENDING_STATES = ['planned', 'toaccept', 'tentative', 'torecord', 'draft', 'changed'];
function inState(m, f) {
  if (!f || f === 'all') return true;
  const st = stateOf(m);
  if (f === 'pending') return PENDING_STATES.includes(st);
  if (f === 'todo') return st === 'torecord' || st === 'draft' || st === 'changed';
  if (f === 'done') return st === 'ready' || st === 'exported';
  if (f === 'agenda') return st === 'planned' || st === 'tentative' || st === 'toaccept';
  if (f === 'exported') return m.status === 'exported';
  return st === f;
}

async function bulkAction(kind) {
  const ids = [...S.list.sel]; const ms = ids.map(getM).filter(Boolean);

  if (kind === 'export') return exportNotes(ms, { mark: true });
  if (kind === 'event') return eventPicker(ms, () => viewMeetings());
  if (kind === 'ready' || kind === 'exported') {
    for (const m of ms) { m.status = kind; if (kind === 'exported') { m.updatedAt = Date.now(); m.exportedAt = m.updatedAt; } else m.updatedAt = Date.now(); await DB.put('meetings', m); }
    toast(kind === 'ready' ? 'Marcadas como concluídas' : 'Marcadas como exportadas'); return viewMeetings();
  }
  if (kind === 'delete') {
    if (!(await confirmSheet(`Apagar ${plural(ms.length, 'reunião', 'reuniões')}?`, 'As reuniões e as fotos das notas são apagadas deste dispositivo. Os contactos ficam.'))) return;
    for (const m of ms) await deleteMeeting(m);
    S.list.sel.clear(); toast('Apagadas'); viewMeetings();
  }
}

        <div class="field" style="margin:12px 0 0"><label class="lbl">Evento</label><button class="inp evbtn" data-evpick id="evpick"></button></div>
        ${['CANCELLED', 'TENTATIVE', 'NEEDS-ACTION'].includes(m.icsStatus) ? `<div class="locline ${m.icsStatus === 'CANCELLED' ? 'cancel' : ''}">${ico(m.icsStatus === 'CANCELLED' ? 'x' : 'cal', 'sm')} ${m.icsStatus === 'CANCELLED' ? 'Cancelada na agenda' : m.icsStatus === 'NEEDS-ACTION' ? 'Por aceitar na agenda (falta aceitar do nosso lado)' : 'Por confirmar na agenda'}</div>` : ''}
      </div>

      ${secHTML}
      ${desk ? '' : `<div style="text-align:center;padding:6px 0 10px"><button class="btn ghost danger" data-del>${ico('trash', 'sm')} Apagar reunião</button></div>`}

    </div></div>
    <div class="actionbar"><button class="btn" data-sf>${ico('send', 'sm')} Salesforce</button><button class="btn" data-status id="st-mob"></button></div>`;

  const refreshHeader = () => {
    $('#ed-title').firstChild.textContent = m.airlineName || 'Nova reunião';
    const by = m.createdByName && m.createdByName !== Sync.userName ? ` · criada por ${m.createdByName.split(' ')[0]}` : (m.updatedByName && m.updatedByName !== Sync.userName ? ` · editada por ${m.updatedByName.split(' ')[0]}` : '');

    $('#airpick').innerHTML = m.airlineName ? `${badge(m.airlineCode)}<div class="grow"><div class="n">${esc(m.airlineName)}</div><div class="c">${m.airlineCode ? esc(m.airlineCode) + ' · tocar para mudar' : 'Nome livre · tocar para editar'}</div></div>${ico('chev')}` : `${badge('')}<div class="grow"><div class="n">Escolher companhia ou entidade</div><div class="c">Da lista ou com nome livre (ex.: um aeroporto)</div></div>${ico('chev')}`;
    $('#scope').innerHTML = scopeOf(m).length ? scopeOf(m).map((c) => `<span class="chip" style="font-family:var(--mono)">${c}<button class="x ibtn sm" data-rmscope="${c}" aria-label="Retirar ${c}" style="border:0;background:none">${ico('x', 'sm')}</button></span>`).join('') : '<span class="faint" style="font-size:14px">Nenhum</span>';
    const ev = EV.of(m); $('#evpick').innerHTML = ev ? `${ico('cal', 'sm')}<span class="grow"><b>${esc(ev.name)}</b>${EV.sub(ev) ? ` <span class="faint">· ${esc(EV.sub(ev))}</span>` : ''}</span>${ico('chev', 'sm')}` : `${ico('cal', 'sm')}<span class="grow faint">Sem evento · tocar para associar</span>${ico('chev', 'sm')}`;
    const lbl = m.status === 'draft' ? `${ico('check', 'sm')} Marcar como concluída` : m.status === 'ready' ? `${ico('check', 'sm')} Concluída` : `${ico('check', 'sm')} Exportada`;
    for (const b of [$('#st-mob'), $('#st-desk')]) { b.innerHTML = lbl; b.className = 'btn ' + (m.status === 'draft' ? 'dark' : 'ok'); }
    $('#subj-hint').textContent = m.subjectAuto ? `Automático: ${S.settings.subjectPrefix || 'Meeting'}_${S.settings.airportCode || 'OPO'}_<código IATA>_${EV.of(m) ? '<evento>' : '<temas>'}. Podes editar.` : 'Assunto personalizado.';
  };
  const refreshSubject = () => { const el = $('#f-subj'); if (m.subjectAuto && document.activeElement !== el) el.value = autoSubject(m); };
  const refreshAside = debounce(() => renderAside(m), 300);
  const changed = () => { touchMeeting(m); refreshSubject(); refreshHeader(); if (desk) refreshAside(); };

  const refreshRaw = () => { const n = splitBlocks(m.raw).length; $('#raw-count').textContent = n ? plural(n, 'linha', 'linhas') : ''; const b = $('#b-org'); b.disabled = !n; b.innerHTML = `${ico('list', 'sm')} ${AI.available() ? 'Organizar com IA' : 'Organizar por temas'}${n ? ` (${n})` : ''}`; };
  renderPeople(m); renderTopics(m); renderPhotos(m); refreshHeader(); refreshRaw(); renderPrep(m); renderSims(m);
  $('#ed-more')?.addEventListener('toggle', (e) => { S._moreOpen = e.target.open; if (e.target.open) $$('textarea', e.target).forEach(grow); });
  const afterNotes = () => { $('#f-raw').value = m.raw || ''; grow($('#f-raw')); refreshRaw(); renderTopics(m); changed(); };
  if (desk) renderAside(m);

  view.oninput = (e) => {
    const el = e.target;
    if (el.dataset.f) { m[el.dataset.f] = el.value; changed(); }
    if (el.id === 'f-subj') { m.subject = el.value; m.subjectAuto = false; changed(); }
    if (el.dataset.tname != null) { const t = m.topics.find((x) => x.id === el.dataset.tname); t.name = el.value; changed(); }
    if (el.dataset.ttext != null) { const t = m.topics.find((x) => x.id === el.dataset.ttext); t.text = el.value; grow(el); changed(); }
    if (el.id === 'f-next' || el.id === 'f-raw') grow(el);
    if (el.id === 'f-raw') refreshRaw();
  };
  const addScope = () => { const el = $('#f-scope'); const add = parseCodes(el.value); if (!add.length) return toast('Usa códigos de 3 letras (ex.: LIS)'); m.scope = [...new Set([...scopeOf(m), ...add])]; el.value = ''; changed(); };
  $('#f-scope').onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); addScope(); } };
  view.onchange = null;

  view.onclick = async (e) => {
    const t = e.target;
    if (t.closest('[data-back]')) { await flushSaves(); return goBack('#/'); }
    if (t.closest('[data-ask]')) { await flushSaves(); return go('#/perguntar/r-' + m.id); }
    if (t.closest('[data-evpick]')) return eventPicker([m], () => { const ts = $('#f-ts'); if (ts) ts.value = m.tradeshow || ''; refreshSubject(); refreshHeader(); if (desk) renderAside(m); });
    if (t.closest('[data-simnew]')) return simOpen(m, null, () => { renderSims(m); changed(); });
    const so = t.closest('[data-simopen]'); if (so) return simOpen(m, (m.sims || []).find((x) => x.id === so.dataset.simopen), () => { renderSims(m); changed(); });
    const sr = t.closest('[data-simrm]'); if (sr) { if (!(await confirmSheet('Apagar simulação?', 'A simulação é retirada desta reunião.', 'Apagar'))) return; m.sims = (m.sims || []).filter((x) => x.id !== sr.dataset.simrm); renderSims(m); return changed(); }
    if (t.closest('[data-prepgo]')) return runPrep(m);
    if (t.closest('[data-prepall]')) return prepSheet(m);
    if (t.closest('.nrow')) return;
    if (t.closest('[data-air]')) return pickAirline((a) => { m.airlineCode = a.code; m.airlineName = a.name; changed(); renderPrep(m); }, m.airlineName || (m.plannedPeople || []).map((x) => x.company).find(Boolean) || '');
    if (t.closest('[data-addscope]')) return addScope();
    const rs = t.closest('[data-rmscope]'); if (rs) { m.scope = scopeOf(m).filter((c) => c !== rs.dataset.rmscope); return changed(); }
    if (t.closest('[data-card]')) return scanCard(m, () => { renderPeople(m); changed(); });
    if (t.closest('[data-pickc]')) return pickContact(m, () => { renderPeople(m); changed(); });
    const pp = t.closest('[data-planp]'); if (pp) {
      const x = (m.plannedPeople || [])[+pp.dataset.planp]; if (!x) return;
      const parts = x.name.trim().split(/\s+/); const air = matchAirline([x.company]);

      return contactSheet(c, { isNew: true, meeting: m, onSaved: () => { renderPeople(m); changed(); } });
    }
    const rm = t.closest('[data-rmc]'); if (rm) { m.contactIds = m.contactIds.filter((x) => x !== rm.dataset.rmc); renderPeople(m); return changed(); }
    const oc = t.closest('[data-openc]'); if (oc) return contactSheet(getC(oc.dataset.openc), { onSaved: () => { renderPeople(m); changed(); } });
    if (t.closest('[data-organize]')) { await flushSaves(); return aiOrganizeSheet(m, () => { afterNotes(); const nx = $('#f-next'); if (nx) { nx.value = m.nextSteps || ''; grow(nx); } }); }
    if (t.closest('[data-ocrall]')) { if (!m.photoIds.length) return toast('Ainda não há fotos das notas'); return ocrSheet(m, [...m.photoIds], afterNotes); }
    if (t.closest('[data-ocrsel]')) return ocrSheet(m, [m._sel], afterNotes);
    if (t.closest('[data-addtopicmenu]')) return topicMenu(m);
    const tu = t.closest('[data-tup]'); if (tu) return moveTopic(m, tu.dataset.tup, -1);
    const td = t.closest('[data-tdown]'); if (td) return moveTopic(m, td.dataset.tdown, 1);
    const tr = t.closest('[data-trm]'); if (tr) {
      const tp = m.topics.find((x) => x.id === tr.dataset.trm);

    }

      await removePhoto(m, rmp.dataset.rmph); return toast('Foto apagada');

    const ph = t.closest('[data-ph]'); if (ph) {
      if (desk && t.closest('#aside')) { m._sel = ph.dataset.ph; return renderAside(m); }
      return openViewer([...m.photoIds], m.photoIds.indexOf(ph.dataset.ph), { onDelete: (pid) => removePhoto(m, pid), onOcr: (pid) => ocrSheet(m, [pid], afterNotes) });
    }
    if (t.closest('[data-bigview]')) return openViewer([...m.photoIds], Math.max(0, m.photoIds.indexOf(m._sel)), { onDelete: (pid) => removePhoto(m, pid), onOcr: (pid) => ocrSheet(m, [pid], afterNotes) });
    if (t.closest('[data-subjauto]')) { m.subjectAuto = true; m.subject = ''; $('#f-subj').value = autoSubject(m); return changed(); }
    if (t.closest('[data-sf]')) { await flushSaves(); return sfSheet(m, () => { refreshHeader(); if (desk) renderAside(m); }); }
    if (t.closest('[data-status]')) return toggleStatus(m, () => { refreshHeader(); if (desk) renderAside(m); });
    if (t.closest('[data-del]')) return delMeetingFlow(m);
    if (t.closest('[data-menu]')) return meetingMenu(m);
    if (t.closest('#aside') && TR.click(m, e, () => { if (isDesk()) renderAside(m); })) return;
    if (t.closest('[data-copydesc]')) { await copyText(commentsText(m)); return toast(m.sfLang === 'en' ? 'Comments (EN) copiados' : 'Comments copiados'); }
  };
  async function removePhoto(mm, pid) { await DB.del('photos', pid); dropURL(pid); mm.photoIds = mm.photoIds.filter((x) => x !== pid); renderPhotos(mm); touchMeeting(mm); if (desk) renderAside(mm); }
  $$('textarea', view).forEach(grow);
}
function grow(el) { if (!el) return; el.style.height = 'auto'; el.style.height = Math.max(el.scrollHeight + 2, 76) + 'px'; }

function renderPeople(m) {
  const box = $('#people'); if (!box) return;
  const cs = m.contactIds.map(getC).filter(Boolean);
  const linked = new Set(cs.map((c) => norm(contactName(c))));
  const planned = (m.plannedPeople || []).map((x, i) => ({ ...x, i })).filter((x) => !linked.has(norm(x.name)));
  const planHtml = planned.length ? `<div class="hint" style="margin:${cs.length ? '4px' : '0'} 0 6px">Na agenda — toca para criar o contacto:</div><div class="plan-chips">${planned.map((x) => `<button class="chip add" data-planp="${x.i}">${ico('plus', 'sm')}${esc(x.name)}${x.company ? ` <small>${esc(x.company)}</small>` : ''}</button>`).join('')}</div>` : '';
  box.innerHTML = planHtml + (cs.length ? '' : (planned.length ? '' : '<div class="faint" style="font-size:14px">Fotografa o cartão de visita e os dados são lidos automaticamente.</div>')) + (cs.length ? cs.map((c) => `<div class="person"><div class="av">${c.cardPhotoId ? `<img data-pid="${c.cardPhotoId}" alt="">` : ico('user', 'sm')}</div><div class="grow" data-openc="${c.id}"><div class="t">${esc(contactName(c))}</div><div class="s">${esc([c.title, c.email].filter(Boolean).join(' · ') || 'Sem detalhes')}</div></div><button class="ibtn sm" data-rmc="${c.id}" aria-label="Retirar da reunião">${ico('x', 'sm')}</button></div>`).join('') : '');
  hydrateImgs(box);
}
function renderTopics(m) {
  const box = $('#topics'); if (!box) return;
  box.innerHTML = m.topics.map((t, i) => `<div class="topic" data-tid="${t.id}"><div class="topic-h"><input data-tname="${t.id}" value="${esc(t.name)}" aria-label="Nome do tema"><button class="ibtn sm" data-tup="${t.id}" ${i === 0 ? 'disabled style="opacity:.3"' : ''} aria-label="Subir">${ico('up', 'sm')}</button><button class="ibtn sm" data-tdown="${t.id}" ${i === m.topics.length - 1 ? 'disabled style="opacity:.3"' : ''} aria-label="Descer">${ico('down', 'sm')}</button><button class="ibtn sm" data-trm="${t.id}" aria-label="Remover tema">${ico('x', 'sm')}</button></div><textarea data-ttext="${t.id}" placeholder="O que foi dito sobre este tema… (dica: usa o microfone do teclado para ditar)">${esc(t.text)}</textarea></div>`).join('');
  const used = new Set(m.topics.map((t) => norm(t.name)));
  if (!m.topics.length) box.innerHTML = '<p class="hint">Os temas aparecem aqui quando organizares as notas. Também podes criar um tema diretamente.</p>';
  void used;
  $('#t-count').textContent = m.topics.length ? plural(m.topics.length, 'tema', 'temas') : '';
  $$('textarea', box).forEach(grow);
}
function addTopic(m, name) {
  const t = { id: uid(), name, text: '' }; m.topics.push(t); renderTopics(m); touchMeeting(m);
  const el = $(`[data-ttext="${t.id}"]`); if (el) { el.focus(); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
  const sj = $('#f-subj'); if (sj && m.subjectAuto) sj.value = autoSubject(m);
  if (isDesk()) renderAside(m);
}
function moveTopic(m, id, dir) {
  const i = m.topics.findIndex((t) => t.id === id); const j = i + dir; if (j < 0 || j >= m.topics.length) return;
  [m.topics[i], m.topics[j]] = [m.topics[j], m.topics[i]]; renderTopics(m); touchMeeting(m);
  const sj = $('#f-subj'); if (sj && m.subjectAuto) sj.value = autoSubject(m);
}
function photoTiles(m) {
  return m.photoIds.map((pid, i) => `<div class="phw"><button class="ph ${m._sel === pid ? 'on' : ''}" data-ph="${pid}" aria-label="Ver foto ${i + 1}"><img data-pid="${pid}" alt=""></button><button class="phx" data-rmph="${pid}" aria-label="Apagar foto ${i + 1}" title="Apagar foto">${ico('x', 'sm')}</button></div>`).join('') +
    `<button class="ph add" data-addphoto="cam">${ico('camera', 'lg')}Câmara</button><button class="ph add" data-addphoto="gal">${ico('image', 'lg')}Galeria</button>`;
}
function renderPhotos(m) {
  const box = $('#photos'); if (!box) return;
  box.innerHTML = photoTiles(m); $('#p-count').textContent = m.photoIds.length ? plural(m.photoIds.length, 'foto', 'fotos') : '';
  hydrateImgs(box);
}
async function addPhotos(m, cam) {
  const files = await pickImages({ capture: cam, multiple: !cam }); if (!files.length) return;
  toast(files.length > 1 ? `A guardar ${files.length} fotos…` : 'A guardar foto…');
  for (const f of files) { try { const p = await savePhoto(f, 'note', m.id); m.photoIds.push(p.id); if (!m._sel) m._sel = p.id; } catch (e) { toast('Não foi possível ler uma das imagens'); } }
  renderPhotos(m); touchMeeting(m); if (isDesk()) renderAside(m);
  toast(files.length > 1 ? 'Fotos guardadas' : 'Foto guardada');
}
function renderAside(m) {
  const box = $('#aside'); if (!box) return;
  if (m._sel && !m.photoIds.includes(m._sel)) m._sel = null;
  if (!m._sel && m.photoIds.length) m._sel = m.photoIds[0];
  const C = sfComments(m, 'data-copydesc', 'Copiar');
  box.innerHTML = `
    <div class="sec"><h3>${ico('image', 'sm')} Fotos das notas <span class="r">${m._sel ? `<button class="btn sm" data-ocrsel>${ico('scan', 'sm')} Extrair texto</button>` : ''}</span></h3>
      ${m._sel ? `<div class="viewer-inline" data-bigview title="Abrir em ecrã inteiro"><img data-pid="${m._sel}" data-full="1" alt="Nota manuscrita"></div>` : '<p class="faint" style="margin:0 0 10px;font-size:14px">Sem fotos. No telemóvel, fotografa as notas logo a seguir à reunião — aqui ficam ao lado do texto para transcreveres.</p>'}
      <div class="photos">${photoTiles(m)}</div></div>
    <div class="sec" id="sfprevsec"><h3>${ico('send', 'sm')} Pré-visualização Salesforce <span class="r">${C.head}</span></h3>
      <div style="font-weight:650;margin-bottom:8px">${esc(subjectOf(m))}</div>
      ${C.body}</div>`;
  hydrateImgs(box);
}
function topicMenu(m) {
  const used = new Set(m.topics.map((t) => norm(t.name)));
  const opts = S.settings.topics.filter((n) => !used.has(norm(n)));
  const sh = sheet({ title: 'Novo tema', body: `<div class="chips">${opts.map((n) => `<button class="chip add" data-n="${esc(n)}">${ico('plus', 'sm')}${esc(n)}</button>`).join('')}<button class="chip add" data-other>${ico('plus', 'sm')}Outro…</button></div>` });
  sh.el.onclick = async (e) => {
    const b = e.target.closest('[data-n]'); if (b) { sh.close(); return addTopic(m, b.dataset.n); }

function organizeSheet(m, after) {

  const sh = sheet({ title: 'Organizar por temas', wide: true, body: `<p class="hint">Escolhe o tema de cada nota. As sugestões vêm pré-marcadas a azul — confirma ou muda. O que deixares em «Fica nas notas» não sai das notas.</p><div id="blks"></div>`,

const nameCase = (x) => { x = String(x || '').trim(); return x && x === x.toUpperCase() && /[A-ZÀ-Ý]/.test(x) ? x.toLowerCase().replace(/(^|[\s\-'’.])(\p{L})/gu, (_, a, b) => a + b.toUpperCase()) : x; };
const DIR = {
  rows: null, meta: null, loading: null,
  COLS: 'id,nome,apelido,conta,conta_id,cargo,email,telefone,telemovel,bu,alterado_sf,lote,atualizado_em',
  // linha compacta → objeto
  obj(r) { return { id: r[0], first: r[1], last: r[2], account: r[3], accountId: r[4], title: r[5], email: r[6], phone: r[7], mobile: r[8], bu: r[9], modified: r[10], k: r[11] }; },
  name(d) { return [nameCase(d.first), nameCase(d.last)].filter(Boolean).join(' ') || d.email || 'Sem nome'; },
  async load() {
    if (this.rows) return this.rows;
    if (!this.loading) this.loading = (async () => {
      let k = null; try { k = await DB.get('kv', 'dir'); } catch (e) {}
      this.meta = k ? { lote: k.lote, at: k.at, count: (k.rows || []).length, checked: k.checked || 0 } : null;
      this.rows = (k?.rows || []).map((r) => { const d = this.obj(r); d.k = norm([d.first, d.last, d.account, d.email, d.title].join(' ')); return d; });
      return this.rows;
    })();
    return this.loading;
  },
  count() { return this.rows ? this.rows.length : (this.meta?.count || 0); },
  // vai buscar ao Supabase se houver importação nova (vê no máximo de 6 em 6 horas, ou quando pedido)
  async refresh(force = false) {
    await this.load();
    if (!Sync.on() || !navigator.onLine) return false;
    if (!force && this.meta && Date.now() - (this.meta.checked || 0) < 6 * 3600e3) return false;
    const sb = Sync.client();
    const top = await sb.from('crm_diretorio').select('lote,atualizado_em').order('atualizado_em', { ascending: false }).limit(1);
    if (top.error) { if (/crm_diretorio/.test(top.error.message || '')) return false; throw top.error; }
    const lote = top.data?.[0]?.lote || '';
    if (this.meta && this.meta.lote === lote && !force) { this.meta.checked = Date.now(); await this.store(null); return false; }
    const all = [];
    for (let off = 0; ; off += 1000) {
      const { data, error } = await sb.from('crm_diretorio').select(this.COLS).order('id').range(off, off + 999);
      if (error) throw error;
      for (const x of data) all.push([x.id, x.nome, x.apelido, x.conta, x.conta_id, x.cargo, x.email, x.telefone, x.telemovel, x.bu, x.alterado_sf || '']);

  },
  async store() { try { const k = (await DB.get('kv', 'dir')) || {}; k.checked = Date.now(); await DB.rawPut('kv', k, 'dir'); } catch (e) {} },
  // pesquisa por nome (e conta, email, cargo); a companhia da reunião aparece primeiro
  search(q, { airline = '', limit = 30 } = {}) {
    if (!this.rows) return [];
    const ws = norm(q).split(/\s+/).filter(Boolean); if (!ws.length) return [];
    const an = norm(airline);
    const hits = this.rows.filter((d) => ws.every((w) => d.k.includes(w)));
    const score = (d) => { const nm = norm(d.first + ' ' + d.last); let sc = 0; if (ws.every((w) => nm.includes(w))) sc += 4; if (nm.startsWith(ws[0]) || norm(d.last).startsWith(ws[0])) sc += 2; if (an && (norm(d.account).includes(an) || an.includes(norm(d.account)))) sc += 3; if (d.bu === 'ANA') sc += 1; return sc; };
    return hits.map((d) => [d, score(d)]).sort((a, b) => b[1] - a[1] || (b[0].modified || '').localeCompare(a[0].modified || '')).slice(0, limit).map((x) => x[0]);
  },
  byEmail(em) { em = String(em || '').trim().toLowerCase(); return em && this.rows ? this.rows.find((d) => (d.email || '').toLowerCase() === em) || null : null; },
  byName(first, last) { const a = norm(first), b = norm(last); if (!b || !this.rows) return null; const l = this.rows.filter((d) => norm(d.last) === b && (!a || norm(d.first) === a || norm(d.first).startsWith(a))); return l.length === 1 ? l[0] : null; },
  // contas do Salesforce com nome parecido ao da companhia (para ligar a conta à companhia)
  accounts(name) {

  // contacto do Debrief a partir de uma linha do diretório (ou o que já existe com o mesmo ID/email)
  async toContact(d) {

    if (c) { let ch = false; for (const [k, v] of [['sfId', d.id], ['title', d.title], ['email', d.email], ['phone', d.phone], ['mobile', d.mobile]]) if (!c[k] && v) { c[k] = v; ch = true; } if (ch) { c.updatedAt = Date.now(); await DB.put('contacts', c); } return c; }

  row(d, attr) { return `<button class="pickrow" ${attr}>${ico('user', 'sm')}<div class="grow"><div class="t">${esc(this.name(d))} <span class="sftag">SF</span></div><div class="s">${esc([d.title, d.account].filter(Boolean).join(' · '))}</div></div></button>`; },
  // importação do CSV exportado do Salesforce
  parseCSV(text) {
    text = text.replace(/^﻿/, '');
    const first = text.slice(0, text.indexOf('\n') > 0 ? text.indexOf('\n') : text.length);
    const sep = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : (first.includes('\t') ? '\t' : ',');
    const rows = []; let row = [], cur = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];

      if (ch === '"') q = true; else if (ch === sep) { row.push(cur); cur = ''; } else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); cur = ''; if (row.some((x) => x !== '')) rows.push(row); row = []; } else cur += ch;
    }

    const ix = { id: col('contact id', 'id do contacto', 'id'), first: col('first name', 'nome proprio'), last: col('last name', 'apelido'), account: col('account name', 'nome da conta'), accountId: col('account id', 'id da conta'),
      title: col('title/role', 'title', 'cargo'), email: col('email'), phone: col('phone 1', 'phone', 'telefone'), mobile: col('mobile', 'telemovel'), bu: col('bu'), modified: col('last modified date', 'data da ultima modificacao') };

    const out = new Map();
    for (const r of rows) { const id = g(r, 'id'); if (!/^003[A-Za-z0-9]{12}([A-Za-z0-9]{3})?$/.test(id)) continue; out.set(id, { id, nome: g(r, 'first'), apelido: g(r, 'last'), conta: g(r, 'account'), conta_id: g(r, 'accountId'), cargo: g(r, 'title'), email: g(r, 'email'), telefone: g(r, 'phone'), telemovel: g(r, 'mobile'), bu: g(r, 'bu'), alterado_sf: date(g(r, 'modified')) }); }
    return [...out.values()];
  },
  async importCSV(file, progress) {

    const sb = Sync.client(); const lote = uid(); const now = new Date().toISOString();

      const { error } = await sb.from('crm_diretorio').upsert(list.slice(i, i + 500).map((x) => ({ ...x, lote, atualizado_em: now })), { onConflict: 'id' });
      if (error) throw new Error(/crm_diretorio/.test(error.message || '') ? 'Falta criar a tabela do diretório no Supabase (06_diretorio.sql)' : error.message);

};

/* ---------- abrir o New Meeting Note já preenchido (URL do Lightning com defaultFieldValues) */
function sfParse(str) {
  const s = String(str || '').trim();
  let dom = (s.match(/https?:\/\/([a-z0-9.-]+\.(?:lightning\.force\.com|my\.salesforce\.com|salesforce\.com))/i) || [])[1] || '';
  dom = dom.toLowerCase().replace(/\.my\.salesforce\.com$/, '.lightning.force.com');
  const ids = s.match(/\b(?:001|003|012)[A-Za-z0-9]{12}(?:[A-Za-z0-9]{3})?\b/g) || [];
  return { dom, acc: ids.find((x) => x.startsWith('001')) || '', con: ids.find((x) => x.startsWith('003')) || '', rt: ids.find((x) => x.startsWith('012')) || '' };
}
const SF_ID = (pre) => new RegExp(`^${pre}[A-Za-z0-9]{12}([A-Za-z0-9]{3})?$`);
function sfLink(m) {
  // O «New Meeting Note» é a ação rápida global Global.NewMeetingNote: aberta pelo endereço, já vem com a conta (Related To),
  // o tipo de registo e a data. O Salesforce ignora valores pré-preenchidos nas ações rápidas, por isso o resto copia-se.
  const dom = (S.settings.sfDomain || '').trim(); if (!dom) return null;
  const acc = sfAcc({ code: m.airlineCode, name: m.airlineName });
  if (!SF_ID('001').test(acc.id || '')) return { url: '', acc: false };
  const bg = encodeURIComponent(`/lightning/r/Account/${acc.id}/view`);
  return { url: `https://${dom}/lightning/action/quick/Global.NewMeetingNote?objectApiName&context=RECORD_DETAIL&recordId=${acc.id}&backgroundContext=${bg}`, acc: true };
}
function sfLinkBox(m) {
  const L = sfLink(m);
  if (!L) return `<div class="sflink"><b>Abrir o New Meeting Note da conta</b><p>Cola aqui o endereço da conta ${esc(m.airlineName || 'da companhia')} no Salesforce. Fica guardado para as próximas reuniões (e para o colega).</p><div class="subj-row"><input class="inp" id="sf-paste" placeholder="https://….lightning.force.com/lightning/r/Account/001…/view" autocapitalize="off"><button class="btn" data-sfpaste>Guardar</button></div></div>`;
  const sug = !L.acc ? DIR.accounts(m.airlineName) : [];
  if (!L.acc) return `<div class="sflink"><b>Abrir o New Meeting Note da conta</b><p>Falta ligar a conta ${esc(m.airlineName || 'da companhia')}${sug.length ? '. Contas do diretório Salesforce com este nome — toca na certa:' : ': abre-a no Salesforce e cola aqui o endereço (fica guardado).'}</p>${sug.length ? `<div class="chips" style="margin-bottom:10px">${sug.map((a) => `<button class="chip add" data-sfaccpick="${esc(a.id)}" data-sfaccname="${esc(a.name)}">${esc(a.name)} <small class="faint">${plural(a.n, 'contacto', 'contactos')}</small></button>`).join('')}</div><p style="margin-top:0">Ou cola o endereço da conta:</p>` : ''}<div class="subj-row"><input class="inp" id="sf-acc" placeholder="Endereço ou ID da conta (001…)" autocapitalize="off"><button class="btn sm" data-sfacc>Ligar conta</button></div></div>`;
  return `<div class="sflink"><a class="btn pri" href="${esc(L.url)}" target="_blank" rel="noopener noreferrer" data-sfopen>${ico('send', 'sm')} Abrir o New Meeting Note da conta</a>
    <p>Abre já com <b>Related To</b>, tipo de registo e data. Os <b>Comments</b> ficam copiados ao abrir: cola-os e copia daqui o Subject, o Name, o Flag e o Scope. No telemóvel abre no browser.</p></div>`;
}

function rerenderKeep() { const y = window.scrollY; route(); window.scrollTo(0, y); }
const stamp = () => { const d = new Date(); return `${ymd(d)}_${pad(d.getHours())}${pad(d.getMinutes())}`; };
async function exportNotes(ms, { mark = true } = {}) {
  if (!ms.length) return;
  const ok = await saveFile(`salesforce_meeting_notes_${stamp()}.csv`, notesCSV(ms), 'text/csv;charset=utf-8'); if (!ok) return;
  if (mark) { const now = Date.now(); for (const m of ms) { m.status = 'exported'; m.updatedAt = now; m.exportedAt = now; await DB.put('meetings', m); } }
  toast(mark ? 'Ficheiro criado e reuniões marcadas como exportadas' : 'Ficheiro criado');
  S.list.sel.clear(); rerenderKeep();
}
async function exportContacts(cs, { mark = true } = {}) {
  if (!cs.length) return;
  const ok = await saveFile(`salesforce_contactos_${stamp()}.csv`, contactsCSV(cs), 'text/csv;charset=utf-8'); if (!ok) return;
  if (mark) { const now = Date.now(); for (const c of cs) { c.exportedAt = now; c.updatedAt = now; await DB.put('contacts', c); } }
  toast('Ficheiro de contactos criado'); rerenderKeep();
}

/* ---------- cópia de segurança */
function abToB64(ab) { const u8 = new Uint8Array(ab); let s = ''; const CH = 0x8000; for (let i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH)); return btoa(s); }
function b64ToAb(b64) { const s = atob(b64); const u8 = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u8[i] = s.charCodeAt(i); return u8.buffer; }
async function exportBackup() {
  await flushSaves();
  toast('A preparar a cópia…');
  let photos = await DB.all('photos');
  if (Sync.on()) for (const ph of photos) if (!ph.data) { const got = await ensurePhoto(ph.id, true); if (got?.data) ph.data = got.data; }
  photos = photos.filter((ph) => ph.data);
  const payload = { app: 'debrief', format: 1, version: APP_VERSION, exportedAt: new Date().toISOString(), settings: { ...S.settings, lastBackupAt: undefined, iosHintDismissed: undefined },
    meetings: S.meetings, contacts: S.contacts, photos: photos.map((p) => ({ ...p, data: abToB64(p.data), thumb: p.thumb ? abToB64(p.thumb) : null })) };
  const ok = await saveFile(`debrief_copia_${stamp()}.json`, JSON.stringify(payload), 'application/json');
  if (ok) { S.settings.lastBackupAt = Date.now(); await saveSettings(); toast(`Cópia criada · ${plural(S.meetings.length, 'reunião', 'reuniões')}, ${plural(photos.length, 'foto', 'fotos')}`); route(); }
}
async function importBackup() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    let data; try { data = JSON.parse(await f.text()); } catch (e) { return toast('Ficheiro inválido'); }
    if (data.app !== 'debrief') return toast('Este ficheiro não é uma cópia do Debrief');
    const n = { m: 0, c: 0, p: 0 };
    const newer = (inc, cur) => !cur || (inc.updatedAt || 0) > (cur.updatedAt || 0);
    for (const p of data.photos || []) { const cur = await DB.get('photos', p.id); if (!cur) { await DB.put('photos', { ...p, data: b64ToAb(p.data), thumb: p.thumb ? b64ToAb(p.thumb) : null }); n.p++; } }
    for (const c of data.contacts || []) { if (newer(c, getC(c.id))) { await DB.put('contacts', c); n.c++; } }
    for (const m of data.meetings || []) { if (newer(m, getM(m.id))) { await DB.put('meetings', m); n.m++; } }
    if (data.settings) {
      const s = data.settings, cur = S.settings;
      for (const a of s.customAirlines || []) if (!(cur.customAirlines || []).some((x) => airlineKey(x) === airlineKey(a))) cur.customAirlines.push(a);
      cur.airlineSf = { ...(s.airlineSf || {}), ...(cur.airlineSf || {}) };
      for (const t of s.topics || []) if (!cur.topics.some((x) => norm(x) === norm(t))) cur.topics.push(t);
      await saveSettings();
    }
    await loadAll(); askPersist();
    toast(`Importado: ${plural(n.m, 'reunião', 'reuniões')}, ${plural(n.c, 'contacto', 'contactos')}, ${plural(n.p, 'foto', 'fotos')}`);
    route();
  };
  inp.click();
}

    await Sync.save(); enterApp(true);
  };
  view.querySelector('[data-local]').onclick = async () => { Sync.mode = 'local'; await Sync.save(); enterApp(false); };
}
function showNoAccess() {
  gate(`<h1>Sem acesso às reuniões</h1><p>A tua conta (${esc(Sync.email)}) ainda não tem a permissão <b>«Reuniões companhias»</b>. Pede a um administrador do Portal para a ativar e volta a entrar.</p>
    <button class="btn pri block" data-retry>Tentar outra vez</button><button class="btn block" data-out style="margin-top:10px">Usar outra conta</button><button class="btn ghost block" data-local style="margin-top:10px">Usar só neste dispositivo</button>`);
  view.querySelector('[data-retry]').onclick = async () => { Sync.mode = 'cloud'; const r = await Sync.verify(); if (r === 'ok') { await Sync.save(); enterApp(true); } else { Sync.mode = null; await Sync.save(); toast('Ainda sem permissão'); } };
  view.querySelector('[data-out]').onclick = async () => { try { await Sync.client().auth.signOut(); } catch (e) {} Sync.mode = null; Sync.userId = null; await Sync.save(); showLogin(); };
  view.querySelector('[data-local]').onclick = async () => { try { await Sync.client().auth.signOut(); } catch (e) {} Sync.mode = 'local'; Sync.userId = null; await Sync.save(); enterApp(false); };
}
/* ---------- novidades de cada versão */
const vnum = (v) => String(v || '0').split('.').map((x) => +x || 0).reduce((a, x) => a * 1000 + x, 0);
function novidadesSheet() {
  $('#nov-card')?.remove();
  sheet({ title: 'Novidades', body: NOVIDADES.map((n) => `<section class="nov"><h4>Versão ${esc(n.v)} <span class="faint">· ${esc(n.data)}</span>${n.v === APP_VERSION ? ' <span class="pill toaccept">atual</span>' : ''}</h4><ul>${n.itens.map((i) => `<li>${esc(i)}</li>`).join('')}</ul></section>`).join('') });
  markNovidades();
}
async function markNovidades() { if (S.settings.seenVersion !== APP_VERSION) { S.settings.seenVersion = APP_VERSION; await saveSettings(); } }
function novidadesCard() {
  const seen = S.settings.seenVersion;
  if (seen === APP_VERSION || $('#nov-card')) return;
  // instalação nova (sem reuniões nem contactos): não há nada de novo para contar
  if (!seen && !S.meetings.length && !S.contacts.length) { markNovidades(); return; }
  const novas = seen ? NOVIDADES.filter((n) => vnum(n.v) > vnum(seen) && vnum(n.v) <= vnum(APP_VERSION)) : NOVIDADES.slice(0, 4);
  const list = (novas.length ? novas : NOVIDADES.slice(0, 1)).flatMap((n) => n.itens);
  if (!list.length) { markNovidades(); return; }
  const c = document.createElement('div'); c.id = 'nov-card'; c.setAttribute('role', 'status');
  c.innerHTML = `<div class="nov-top"><span class="nov-ic">${ico('check', 'sm')}</span><b>Novidades da versão ${esc(APP_VERSION)}</b><button class="ibtn sm" data-a="ok" aria-label="Fechar">${ico('x', 'sm')}</button></div><ul>${list.slice(0, 4).map((x) => `<li>${esc(x)}</li>`).join('')}</ul>${list.length > 4 ? `<div class="faint" style="font-size:12.5px;margin:-2px 0 8px">e mais ${list.length - 4}…</div>` : ''}<div class="nov-acts"><button class="btn sm" data-a="ok">Entendi</button><button class="btn sm pri" data-a="ver">Ver tudo</button></div>`;
  document.body.appendChild(c); requestAnimationFrame(() => c.classList.add('show'));
  c.onclick = (e) => { const b = e.target.closest('[data-a]'); if (!b) return; markNovidades(); c.classList.remove('show'); setTimeout(() => c.remove(), 220); if (b.dataset.a === 'ver') novidadesSheet(); };
}
async function enterApp(cloud) {
  document.body.classList.remove('gate');
  if (location.hash.startsWith('#/login')) location.hash = '#/';
  route();
  setTimeout(() => { try { novidadesCard(); } catch (e) { console.warn('novidades', e); } }, 900);
  if (cloud) Sync.start();
  setTimeout(() => syncCalendar(), 2500);
}

/* ---------- arranque */
(async function init() {
  try { await DB.open(); await loadAll(); await Sync.load(); }
  catch (e) { view.innerHTML = `<div class="page"><div class="empty"><h2>Não foi possível abrir a base de dados</h2><p>Este browser está a bloquear o armazenamento local (por exemplo, em navegação privada). Abre o Debrief numa janela normal.</p></div></div>`; return; }
  if (Sync.mode === 'local') enterApp(false);
  else if (Sync.mode === 'cloud' && Sync.userId) {
    // entra logo com os dados locais (funciona sem rede) e confirma a sessão em segundo plano
    enterApp(false);
    Sync.verify().then((r) => { if (r === 'ok') Sync.start(); else if (r === 'nosession') showLogin('A sessão terminou. Volta a entrar.'); else showNoAccess(); }).catch(() => Sync.start());
  } else showLogin();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    try {
      const hadController = !!navigator.serviceWorker.controller;
      const reg = await navigator.serviceWorker.register('sw.js');
      reg.addEventListener('updatefound', () => { const w = reg.installing; w && w.addEventListener('statechange', () => { if (w.state === 'activated' && hadController) toast('Nova versão instalada', { label: 'Recarregar', fn: async () => { await flushSaves(); location.reload(); } }); }); });
    } catch (e) {}
  }
})();
</script>
